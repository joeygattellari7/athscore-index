name: Update AthScore Index
on:
  push:
    branches: [main]
    paths: [template.html, inject.py, build_pl_index.py, build_top5.py, build_legends.py, .github/workflows/update.yml]
  schedule:
    - cron: "23 */4 * * *"   # every 4 hours; the page only changes when new games have finished
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pandas pyreadr
      - name: Build ratings from the live Fantasy Premier League feed
        run: FPL_LIVE=1 python build_pl_index.py
      - name: Build La Liga, Serie A, Bundesliga and Ligue 1 from ESPN
        timeout-minutes: 55
        continue-on-error: true      # if Understat is down the page still publishes with the leagues it has, and says what is missing
        run: |
          python build_top5.py
      - name: Build the page
        run: python inject.py
      - name: Save the round snapshot
        run: |
          git config user.name "athscore-bot"
          git config user.email "athscore-bot@users.noreply.github.com"
          git add state status.json
          git add top5_status.json legends_status.json || true
          git diff --cached --quiet || (git commit -m "Snapshot after latest round" && git push)
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deploy
        uses: actions/deploy-pages@v4
